auto-drill-ios-unit-ore = ore
auto-drill-ios-unit-ores = ores
auto-drill-ios-unit-off = off
auto-drill-ios-nothing-to-mine = [AutoDrill] nothing to mine here - tap an ore tile
auto-drill-ios-water-here = [AutoDrill] water is not ore - water extractors and power nodes come with optimised drill fills (Settings: Water Extractors & Power Nodes)
