auto-drill-welcome-title = Auto Drill Information
auto-drill-welcome-text = Thank you for downloading AutoDrill, please read this short tutorial to better understand how to use the mod.
auto-drill-tutorial-text = To enable the mod, either click the mod icon button next to the minimap (1), or press the key H if you are on a desktop, you can change this key in the settings of the mod. When activated a menu will appear above a tapped tile (2), which allows you to select with which drill to fill the tapped resource. Tapping water or bare ground says so instead of building anything - water extractors and power nodes come with the optimised drill fills.
auto-drill-tutorial2-text = For the mechanical drill, pneumatic drill and plasma bore options another menu will appear (3) which allows you to select a direction in which the output of the conveyors will face. Tapping an arrow plans the layout; tapping a different arrow replaces it, and the middle button finishes. The drills themselves always keep the same drilling grid - the arrows only choose which side the belts leave on.
auto-drill-settings-text = The mod has several settings which allows you to change the activation key (default H), change the maximum amount of tiles that are automatically filled with drills or increase the optimization quality and more.
auto-drill-conclusion-text = For more detailed information please visit the github repository (https://github.com/Pointifix/AutoDrill). If you like the mod please leave a star. In case you encounter any bug or you have any feature requests also post them on github.

# --- iOS edition settings (stable keys; titles come from setting.<key>.name) ---
setting.auto-drill-ios-activation-key.name = Activation Key
setting.auto-drill-ios-activation-key.description = Keyboard key that toggles AutoDrill on desktop and iPad keyboards.

setting.auto-drill-ios-display-toggle-button.name = Show Toggle Button
setting.auto-drill-ios-display-toggle-button.description = Whether the AutoDrill button next to the minimap is shown.

setting.mechanical-drill-max-tiles.name = Mechanical Drill: Max Tiles
setting.mechanical-drill-max-tiles.description = How many ore tiles the fill looks at, nearest the tap first. Raise it for huge patches - the fill tells you when a patch was bigger than this.
setting.mechanical-drill-min-ores.name = Mechanical Drill: Min Ores
setting.mechanical-drill-min-ores.description = Minimum ores a mechanical drill must cover. Lower it to reach the rim of a patch.

setting.pneumatic-drill-max-tiles.name = Pneumatic Drill: Max Tiles
setting.pneumatic-drill-max-tiles.description = How many ore tiles the fill looks at, nearest the tap first. Raise it for huge patches - the fill tells you when a patch was bigger than this.
setting.pneumatic-drill-min-ores.name = Pneumatic Drill: Min Ores
setting.pneumatic-drill-min-ores.description = Minimum ores a pneumatic drill must cover. Lower it to reach the rim of a patch.

setting.laser-drill-max-tiles.name = Laser Drill: Max Tiles
setting.laser-drill-max-tiles.description = How many ore tiles the fill looks at, nearest the tap first. Raise it for huge patches - the fill tells you when a patch was bigger than this.
setting.laser-drill-min-ores.name = Laser Drill: Min Ores
setting.laser-drill-min-ores.description = Minimum ores a laser drill must cover. Lower it to reach the rim of a patch: 1 covers everything, at the cost of slow drills there.

setting.airblast-drill-max-tiles.name = Airblast Drill: Max Tiles
setting.airblast-drill-max-tiles.description = How many ore tiles the fill looks at, nearest the tap first. Raise it for huge patches - the fill tells you when a patch was bigger than this.
setting.airblast-drill-min-ores.name = Airblast Drill: Min Ores
setting.airblast-drill-min-ores.description = Minimum ores an airblast drill must cover. Lower it to reach the rim of a patch: 1 covers everything, at the cost of slow drills there.

setting.auto-drill-ios-optimization-quality.name = Optimization Quality
setting.auto-drill-ios-optimization-quality.description = How much of the layout search space is explored on top of the automatic fill. Higher = fewer leftover ore tiles, slower search.

setting.auto-drill-ios-place-water-extractor-and-power-nodes.name = Water Extractors & Power Nodes
setting.auto-drill-ios-place-water-extractor-and-power-nodes.description = Also place a water extractor and a power node next to every optimised drill, and connect the patch to the nearest power grid with a chain of nodes, so the drills actually run.

setting.auto-drill-ios-output-routing-length.name = Output Routing Length
setting.auto-drill-ios-output-routing-length.description = Also build a straight run of conveyors (ducts on Erekir) leading away from every optimised drill; you pick the side with the arrow menu. 0 turns it off.

auto-drill-ios-help-text = Tap the icon next to the minimap (or press the activation key) to arm AutoDrill, then tap an ore tile. Drills are planned over the whole patch; laser, airblast, impact and eruption fills also add a water extractor and a power node next to each drill, and wire the patch into your power grid with a few more nodes when one is in range. The button with the arrow removes the buildings the last fill planned, as long as they have not been built yet.
auto-drill-ios-show-tutorial = Show the tutorial again

