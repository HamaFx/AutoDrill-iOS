auto-drill.settings.title = Авто дрель

auto-drill.settings.activation-desc = Активация мода (клавиатура или кнопка) 
auto-drill.settings.activation-key = Кнопка активации
auto-drill.settings.display-toggle-button = Кнопка переключения отображения

auto-drill.settings.drills-desc = Настройки максимального количества плиток руды, добытых определенным буром, и минимального количества руды, необходимого для размещения бура.
auto-drill.settings.mechanical-drill = Механический бур
auto-drill.settings.pneumatic-drill = Пневматический бур
auto-drill.settings.laser-drill = Лазерный бур 
auto-drill.settings.airblast-drill = Воздушная буровая установка
auto-drill.settings.max-tiles = Макс. количество плиток
auto-drill.settings.min-ores = Мин. Руды

auto-drill.settings.optimization-quality-desc = Алгоритм оптимизации для заполнения области с помощью буров - заполняет все пространство с рудой, начиная с плиток, которые дают самую высокую скорость добычи. Параметр качества оптимизации определяет, как рано этот поиск будет завершен. Увеличение этого числа может дать лучшие результаты в обмен на скорость вычислений.

auto-drill.settings.bridge-drill-min-ores = Минимальное количество руды на механический/пневматический бур
auto-drill.settings.optimization-min-ores-laser-drill = Минимальное количество руды на лазерный бур
auto-drill.settings.optimization-min-ores-airblast-drill = Минимальное количество руды на один воздушный бур
auto-drill.settings.optimization-quality = Качество оптимизации
auto-drill.settings.place-water-extractor-and-power-nodes = Разместить гидронасосы и силовые узлы
auto-drill-welcome-title = Информация об "Авто дрели"
auto-drill-welcome-text = Спасибо за загрузку Авто Дрели, пожалуйста, прочтите это краткое руководство, чтобы лучше понять, как использовать мод.
auto-drill-tutorial-text = Чтобы включить мод, нажмите кнопку значка мода рядом с миникартой (1) или нажмите клавишу H, если вы играете через компьютер, вы можете изменить эту клавишу в настройках мода. При активации над нажатой плиткой с рудой (2) появится меню, которое позволяет выбрать, каким буром заполнить данную залежь руды.
auto-drill-tutorial2-text = Для опций механической дрели, пневматической дрели и воздушной буровой установки появится еще одно меню (3), позволяющее выбрать направление, в котором будет направлен выход конвейеров.
auto-drill-settings-text = Мод имеет несколько настроек, которые позволяют изменить клавишу активации (по умолчанию H), изменить максимальное количество плиток, которые автоматически заполняются бурами, или повысить качество оптимизации и многое другое.
auto-drill-conclusion-text = Для более подробной информации посетите репозиторий github (https://github.com/Pointifix/AutoDrill). Если вам понравился мод, пожалуйста, поставьте звездочку. Если вы обнаружите какую-либо ошибку или у вас есть какие-либо пожелания по функциям, также опубликуйте их на github. Перевёл мод на русский: Silin Veredno

# --- Настройки iOS-издания (ключи стабильны; названия берутся из setting.<key>.name) ---
setting.auto-drill-ios-activation-key.name = Кнопка активации
setting.auto-drill-ios-activation-key.description = Клавиша, включающая AutoDrill, на клавиатурах ПК и iPad.

setting.auto-drill-ios-display-toggle-button.name = Кнопка переключения отображения
setting.auto-drill-ios-display-toggle-button.description = Показывать ли кнопку AutoDrill рядом с миникартой.

setting.mechanical-drill-max-tiles.name = Механический бур: макс. плиток
setting.mechanical-drill-max-tiles.description = Сколько плиток руды просматривает заполнение — сначала ближайшие к нажатию. Увеличьте для огромных залежей: заполнение сообщит, если залежь больше.
setting.mechanical-drill-min-ores.name = Механический бур: мин. руды
setting.mechanical-drill-min-ores.description = Минимум плиток руды под механическим буром. Уменьшите, чтобы охватить край залежи.

setting.pneumatic-drill-max-tiles.name = Пневматический бур: макс. плиток
setting.pneumatic-drill-max-tiles.description = Сколько плиток руды просматривает заполнение — сначала ближайшие к нажатию. Увеличьте для огромных залежей: заполнение сообщит, если залежь больше.
setting.pneumatic-drill-min-ores.name = Пневматический бур: мин. руды
setting.pneumatic-drill-min-ores.description = Минимум плиток руды под пневматическим буром. Уменьшите, чтобы охватить край залежи.

setting.laser-drill-max-tiles.name = Лазерный бур: макс. плиток
setting.laser-drill-max-tiles.description = Сколько плиток руды просматривает заполнение — сначала ближайшие к нажатию. Увеличьте для огромных залежей: заполнение сообщит, если залежь больше.
setting.laser-drill-min-ores.name = Лазерный бур: мин. руды
setting.laser-drill-min-ores.description = Минимум плиток руды под лазерным буром. Уменьшите, чтобы охватить край: 1 закрывает всё, но там буры работают медленно.

setting.airblast-drill-max-tiles.name = Воздушная буровая: макс. плиток
setting.airblast-drill-max-tiles.description = Сколько плиток руды просматривает заполнение — сначала ближайшие к нажатию. Увеличьте для огромных залежей: заполнение сообщит, если залежь больше.
setting.airblast-drill-min-ores.name = Воздушная буровая: мин. руды
setting.airblast-drill-min-ores.description = Минимум плиток руды под воздушной буровой. Уменьшите, чтобы охватить край: 1 закрывает всё, но там буры работают медленно.

setting.auto-drill-ios-build-belt-lanes.name = Полосы для конвейеров
setting.auto-drill-ios-build-belt-lanes.description = Оставляет сквозь залежь полосы для конвейеров и ставит на них энергоблоки и водяные насосы. Участок работает без ручной проводки, но теряется примерно четверть плиток (мостам нужно место между бурами). По умолчанию выключено: закрываются все плитки, а отвод руды — за вами.

setting.auto-drill-ios-optimization-quality.name = Качество оптимизации
setting.auto-drill-ios-optimization-quality.description = Насколько глубоко перебираются варианты размещения вдобавок к автоматическому заполнению. Больше = меньше пропущенных плиток, медленнее поиск.

setting.auto-drill-ios-place-water-extractor-and-power-nodes.name = Вода и энергия
setting.auto-drill-ios-place-water-extractor-and-power-nodes.description = Также планирует то, что нужно бурам: водяные насосы и энергоузлы на Serpulo, лучевые узлы или лучевую башню на Erekir, с подключением к вашей сети, если она рядом. Стоит нескольких плиток руды — буры оставляют для них место.

setting.auto-drill-ios-output-routing-length.name = Длина отводных линий
setting.auto-drill-ios-output-routing-length.description = Дополнительно строит прямую линию конвейеров (протоков на Erekir) от каждого оптимизированного бура; сторону выбирают стрелками. 0 отключает.

auto-drill-ios-help-text = Нажмите значок рядом с миникартой (или клавишу активации), чтобы включить AutoDrill, затем коснитесь плитки руды, парового гейзера или нефтяной почвы. Буры планируются по всей залежи, конденсаторы — на гейзере, нефтеэкстракторы — на нефти (с подводом воды). Лазерные и воздушные заполнения добавляют на Serpulo водяные насосы и энергоузлы; на Erekir — лучевые узлы или лучевую башню. Участок подключается к вашей сети, если она рядом. Кнопка со стрелкой удаляет постройки последнего заполнения, пока они не возведены.
auto-drill-ios-show-tutorial = Показать обучение ещё раз

auto-drill-ios-unit-tiles = плиток
auto-drill-ios-unit-ore = руда
auto-drill-ios-unit-ores = руды
auto-drill-ios-unit-off = выкл
auto-drill-ios-nothing-to-mine = [AutoDrill] здесь нечего добывать — коснитесь плитки руды, парового гейзера или нефтяной почвы
auto-drill-ios-water-here = [AutoDrill] вода — не руда; водяные насосы и энергия приходят с оптимизированными заполнениями (Настройки: Вода и энергия)
setting.auto-drill-ios-layout-variation.name = Вариация раскладки
setting.auto-drill-ios-layout-variation.description = Пересобирает раскладку среди почти лучших вариантов: больше число — другая раскладка (например, чтобы сместить конвейер или пропуск), за это может уйти одна плитка руды; одно и то же число всегда даёт одну и ту же раскладку на любом устройстве. 0 оставляет лучшую раскладку.
auto-drill-ios-unit-reroll = Пересборка
