auto-drill.settings.title = Auto Drill

auto-drill.settings.activation-desc = Aktivierung des Mods (Tastatur oder Schaltfläche)
auto-drill.settings.activation-key = Aktivierungstaste
auto-drill.settings.display-toggle-button = Schaltfläche zum Umschalten anzeigen

auto-drill.settings.drills-desc = Einstellungen für die maximale Menge an Erzfeldern, die ein Bohrer belegt, und die Mindestanzahl an Erzen, die erforderlich sind, damit ein Bohrer darauf platziert werden kann.
auto-drill.settings.mechanical-drill = Mechanischer Bohrer
auto-drill.settings.pneumatic-drill = Pneumatischer Bohrer
auto-drill.settings.laser-drill = Laserbohrer
auto-drill.settings.airblast-drill = Luftstoßbohrer
auto-drill.settings.max-tiles = Max Felder
auto-drill.settings.min-ores = Min Erze

auto-drill.settings.optimization-quality-desc = Der Optimierungsalgorithmus zum Füllen eines Bereichs mit Bohrern probiert alle Möglichkeiten aus, beginnend mit den Feldern, die die höchste Abbaurate erzielen. Der Optimierungsqualitätsparameter bestimmt, wie früh diese Suche beendet wird. Eine Erhöhung dieser Zahl kann zu besseren Ergebnissen auf Kosten der Geschwindigkeit des Algorithmus führen.

auto-drill.settings.bridge-drill-min-ores = Mindesterze pro mechanischem/pneumatischem Bohrer
auto-drill.settings.optimization-min-ores-laser-drill = Mindesterze pro Laserbohrer
auto-drill.settings.optimization-min-ores-airblast-drill = Mindestanzahl an Erzen pro Luftstoßbohrer
auto-drill.settings.optimization-quality = Optimierungsqualität
auto-drill.settings.place-water-extractor-and-power-nodes = Platziere Wasserextraktoren und Stromknoten
auto-drill-welcome-title = Auto Drill Informationen
auto-drill-welcome-text = Vielen Dank, dass du AutoDrill heruntergeladen hast. Lies bitte dieses kurze Tutorial um zu verstehen wie der Mod funktioniert und zu verwenden ist.
auto-drill-tutorial-text = Um den Mod zu aktivieren, klicke entweder auf die Mod-Symbolschaltfläche neben der Minikarte (1) oder falls du am PC spielst, drücke die Taste H. Du kannst diese Taste in den Einstellungen des Mods ändern. Wenn der Mod aktiviert ist und du ein Feld anklickst, erscheint ein Menü (2), in dem du auswählen kannst wie die Resource für dich bebaut werden soll.
auto-drill-tutorial2-text = Für mechanische und pneumatische Bohrer erscheint ein zusätzliches Menü (3), in dem du die Richtung der zu platzierenden Förderbänder auswählen kannst.
auto-drill-settings-text = Du kannst verschiedenste Aspekte des Mods konfiguieren, wie in etwa die Aktivierungstaste (Standardtaste H), die maximale Anzahl an Felder die der Mod Pro Aktion bebauen kann, sowie die Optimierungsqualität der Platzierung der Bohrer und vieles mehr.
auto-drill-conclusion-text = Für mehr Details besuche das Github Repository des Mods (https://github.com/Pointifix/AutoDrill). Wenn dir der Mod gefällt lass gerne einen Stern auf Github oder falls dir irgendwelche Fehler und Bugs ausfallen dann bitte auf Github melden.

# --- iOS-Einstellungsseite (Schlüssel stabil; Titel kommen aus setting.<key>.name) ---
setting.auto-drill-ios-activation-key.name = Aktivierungstaste
setting.auto-drill-ios-activation-key.description = Taste, die AutoDrill auf Desktop- und iPad-Tastaturen umschaltet.

setting.auto-drill-ios-display-toggle-button.name = Schaltfläche anzeigen
setting.auto-drill-ios-display-toggle-button.description = Ob die AutoDrill-Schaltfläche neben der Minikarte angezeigt wird.

setting.mechanical-drill-max-tiles.name = Mechanischer Bohrer: Max. Felder
setting.mechanical-drill-max-tiles.description = Wie viele Erzfelder die Füllung betrachtet, zuerst die nahe am Tipp. Für sehr große Vorkommen erhöhen - die Füllung meldet, wenn ein Vorkommen größer war.
setting.mechanical-drill-min-ores.name = Mechanischer Bohrer: Min. Erze
setting.mechanical-drill-min-ores.description = Mindeste Erzfelder, die ein mechanischer Bohrer bedecken muss. Senken, um den Rand eines Vorkommens zu erreichen.

setting.pneumatic-drill-max-tiles.name = Pneumatischer Bohrer: Max. Felder
setting.pneumatic-drill-max-tiles.description = Wie viele Erzfelder die Füllung betrachtet, zuerst die nahe am Tipp. Für sehr große Vorkommen erhöhen - die Füllung meldet, wenn ein Vorkommen größer war.
setting.pneumatic-drill-min-ores.name = Pneumatischer Bohrer: Min. Erze
setting.pneumatic-drill-min-ores.description = Mindeste Erzfelder, die ein pneumatischer Bohrer bedecken muss. Senken, um den Rand eines Vorkommens zu erreichen.

setting.laser-drill-max-tiles.name = Laserbohrer: Max. Felder
setting.laser-drill-max-tiles.description = Wie viele Erzfelder die Füllung betrachtet, zuerst die nahe am Tipp. Für sehr große Vorkommen erhöhen - die Füllung meldet, wenn ein Vorkommen größer war.
setting.laser-drill-min-ores.name = Laserbohrer: Min. Erze
setting.laser-drill-min-ores.description = Mindeste Erzfelder, die ein Laserbohrer bedecken muss. Senken, um den Rand zu erreichen: 1 bedeckt alles, dort arbeiten die Bohrer aber langsam.

setting.airblast-drill-max-tiles.name = Luftstoßbohrer: Max. Felder
setting.airblast-drill-max-tiles.description = Wie viele Erzfelder die Füllung betrachtet, zuerst die nahe am Tipp. Für sehr große Vorkommen erhöhen - die Füllung meldet, wenn ein Vorkommen größer war.
setting.airblast-drill-min-ores.name = Luftstoßbohrer: Min. Erze
setting.airblast-drill-min-ores.description = Mindeste Erzfelder, die ein Luftstoßbohrer bedecken muss. Senken, um den Rand zu erreichen: 1 bedeckt alles, dort arbeiten die Bohrer aber langsam.

setting.auto-drill-ios-build-belt-lanes.name = Förderband-Spuren bauen
setting.auto-drill-ios-build-belt-lanes.description = Hält Spuren durch das Vorkommen für Bänder frei und setzt Stromblöcke und Wasserextraktoren darauf. Das Vorkommen läuft dann ohne manuelles Verkabeln, kostet aber etwa ein Viertel seiner Felder (Brücken brauchen Platz zwischen den Bohrern). Standardmäßig aus: alle Felder werden bedeckt, die Wege legst du selbst.

setting.auto-drill-ios-optimization-quality.name = Optimierungsqualität
setting.auto-drill-ios-optimization-quality.description = Wie viel vom Suchraum zusätzlich zum automatischen Füllen untersucht wird. Höher = weniger übrig bleibende Erzfelder, langsamere Suche.

setting.auto-drill-ios-place-water-extractor-and-power-nodes.name = Wasser- & Stromversorgung
setting.auto-drill-ios-place-water-extractor-and-power-nodes.description = Plant auch, was die Bohrer zum Laufen brauchen: Wasserextraktoren und Stromknoten auf Serpulo, Strahlknoten oder einen Strahlturm auf Erekir, mit deinem Netz verbunden, wenn eines in Reichweite ist. Kostet ein paar Erzfelder - die Bohrer lassen Platz dafür.

setting.auto-drill-ios-output-routing-length.name = Länge der Ausgabewege
setting.auto-drill-ios-output-routing-length.description = Baut zusätzlich eine gerade Förderbandlinie (auf Erekir Leitungen) von jedem optimierten Bohrer weg; die Seite wählst du im Pfeilmenü. 0 schaltet es aus.

auto-drill-ios-help-text = Tippe auf das Symbol neben der Minikarte (oder drücke die Aktivierungstaste), um AutoDrill zu aktivieren, und tippe dann auf ein Erzfeld, einen Dampfschacht oder Ölboden. Bohrer werden über das ganze Vorkommen geplant, Dampfkondensatoren über einem Schacht, Ölextraktoren über Öl (mit einer Wasserleitung dorthin). Laser- und Luftstoß-Füllungen fügen auf Serpulo Wasserextraktoren und Stromknoten hinzu; Impact- und Eruptions-Füllungen auf Erekir Strahlknoten oder einen Strahlturm. Das Vorkommen wird an dein Netz angeschlossen, wenn eines in Reichweite ist. Die Schaltfläche mit dem Pfeil entfernt die Gebäude der letzten Füllung, solange sie noch nicht gebaut wurden.
auto-drill-ios-show-tutorial = Tutorial erneut anzeigen

auto-drill-ios-unit-tiles = Felder
auto-drill-ios-unit-ore = Erz
auto-drill-ios-unit-ores = Erze
auto-drill-ios-unit-off = aus
auto-drill-ios-nothing-to-mine = [AutoDrill] hier gibt es nichts abzubauen - tippe auf ein Erzfeld, einen Dampfschacht oder Ölboden
auto-drill-ios-water-here = [AutoDrill] Wasser ist kein Erz - Wasserextraktoren und Strom kommen mit optimierten Füllungen (Einstellungen: Wasser- & Stromversorgung)
